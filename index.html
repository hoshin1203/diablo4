const SHARED={"무기":["도살자의 식칼","천 개의 눈 강탈자","녹물림 더크","푸른 서슬","베라티엘의 파편"],
 "방어구":["참회의 경갑","명멸걸음","엔의 축복","서슬판금","영혼 낙인","운명의 주먹","서리불꽃","고통탐식자의 팔목 장갑","운명가죽","신 살해자 왕관","만용","새벽하늘 무릎받이","티볼트의 의지","라카노스의 자취","인내하는 신앙","루시온의 왕관"],
 "장신구":["추방된 군주의 영물","피의 광기 우상","어머니의 품","크팔의 부식된 인장","웬디고 낙인","천둥신의 축복","펠가인의 인장","로크란의 영물"]};
const LEGACY=[
 ["레오릭의 왕관","모든 직업","투구",false],["천벌의 팔보호구","모든 직업","장갑",true],["요르단의 반지","모든 직업","반지",true],["꼬맹이의 블라우스","모든 직업","가슴",false],
 ["아리옥의 바늘","야만용사 / 드루이드 / 혼령사","양손 미늘창",true],["앙리의 쥐잡이","원소술사 / 강령술사 / 악마술사","보조 장비",true],
 ["인검","혼령사 제외 전 직업","한손 도검",true],["용광로","야만용사 / 드루이드 / 강령술사 / 성기사 / 악마술사","양손 철퇴",true],["메서슈미트의 도끼","야만용사 / 드루이드 / 강령술사 / 성기사 / 악마술사","양손 도끼",false]];
const MYTHIC=[["안다리엘의 두개골","모든 직업"],["할리퀸 관모","모든 직업"],["영벌의 후예","모든 직업"],["거짓된 죽음의 수의","모든 직업"],["티리엘의 권능","모든 직업"],["셀리그의 녹은 심장","모든 직업"],["별 없는 하늘의 반지","모든 직업"],["아발리온 - 라이칸더의 창","드루이드 / 원소술사"],["궤멸자","혼령사 제외"],["정의의 검 엘드루인","혼령사 제외"],["박살난 맹세","야만용사 / 드루이드 / 혼령사"],["한아비","야만용사 / 강령술사 / 성기사 / 악마술사"],["전령 네세켐","혼령사"]];

/* ---------- 인덱스 구성 ---------- */
const items=new Map();
const get=(name,kind)=>{if(!items.has(name))items.set(name,{name,kind,classes:new Set(),sources:[],tags:[]});return items.get(name)};
const bossByName=Object.fromEntries(BOSSES.map(b=>[b.n,b]));
BOSSES.forEach(b=>{
  const s=get(b.공용,"unique");s.classes.add("공용");
  s.sources.push({boss:b.n,label:"공용 전담"});
  b.d.forEach((list,i)=>list.split(",").map(x=>x.trim()).forEach(nm=>{
    const it=get(nm,"unique");it.classes.add(CLASSES[i]);it.sources.push({boss:b.n,label:CLASSES[i]+" 전담"});
  }));
});
Object.entries(SHARED).forEach(([cat,list])=>list.forEach(nm=>{const it=get(nm,"unique");it.classes.add("공용");it.shared=cat}));
LEGACY.forEach(([nm,cls,slot,am])=>{const it=get(nm,"legacy");it.cls=cls;it.slot=slot;it.amulet=am});
MYTHIC.forEach(([nm,cls])=>{const it=get(nm,"mythic");it.cls=cls});
const ALL=[...items.values()];

/* ---------- 초성 검색 ---------- */
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const cho=s=>[...s].map(c=>{const k=c.charCodeAt(0)-0xAC00;return k>=0&&k<11172?CHO[Math.floor(k/588)]:c}).join("");
const norm=s=>s.replace(/\s+/g,"").toLowerCase();
ALL.forEach(it=>{it.key=norm(it.name);it.cho=cho(it.key)});
const isChoOnly=q=>/^[ㄱ-ㅎ]+$/.test(q);

/* ---------- 상태 ---------- */
const $=s=>document.querySelector(s);
const q=$("#q"),out=$("#out"),clearBtn=$("#clear");
let cls="전체";
try{const v=localStorage.getItem("d4cls");if(v&&(v==="전체"||CLASSES.includes(v)))cls=v}catch(e){}
const chipsEl=$("#classChips");
["전체",...CLASSES].forEach(c=>{const b=document.createElement("button");b.className="chip";b.textContent=c;b.setAttribute("aria-pressed",c===cls);
  b.onclick=()=>{cls=c;try{localStorage.setItem("d4cls",c)}catch(e){};chipsEl.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.textContent===c));render()};chipsEl.appendChild(b)});

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(name,qq){
  if(!qq||isChoOnly(qq))return esc(name);
  const i=name.indexOf(qq.trim());
  if(i<0)return esc(name);
  return esc(name.slice(0,i))+"<mark>"+esc(name.slice(i,i+qq.trim().length))+"</mark>"+esc(name.slice(i+qq.trim().length));
}
function classOk(it){
  if(cls==="전체")return true;
  if(it.kind==="unique")return it.classes.has(cls)||it.classes.has("공용");
  const c=it.cls;
  if(c==="모든 직업")return true;
  if(c.includes("제외"))return !c.includes(cls);
  return c.includes(cls);
}
function bossBtn(n){return `<button data-boss="${esc(n)}">${esc(n)}</button>`}

function itemCard(it,qq){
  const tags=[];let body="";
  if(it.kind==="mythic"){
    tags.push(`<span class="tag k-mythic">신화 고유</span>`,`<span class="tag">${esc(it.cls)}</span>`);
    body=`<p class="note">특정 우두머리 전담이 아니라 모든 소굴 우두머리 보상에서 직업·장비 제한에 맞게 낮은 확률로 나옵니다. <b>벨리알</b>이 신화 드랍 확률이 가장 높습니다 (${esc(BELIAL.loc)}).</p>`;
  }else if(it.kind==="legacy"){
    tags.push(`<span class="tag k-legacy">시즌15 신규 유산</span>`,`<span class="tag">${esc(it.slot)}</span>`,`<span class="tag">${esc(it.cls)}</span>`,`<span class="tag">고유 부적 ${it.amulet?"가능":"불가"}</span>`);
    body=`<p class="note">전담 우두머리가 확인되지 않았습니다. 일반 드랍, 시즌 콘텐츠, 보상 상자, 제작을 함께 활용하세요.</p>`;
  }else{
    const cl=[...it.classes].filter(c=>c!=="공용");
    tags.push(`<span class="tag">일반 고유</span>`);
    if(cl.length)tags.push(...cl.map(c=>`<span class="tag">${c}</span>`));
    if(it.shared)tags.push(`<span class="tag k-shared">공용 풀 · ${it.shared}</span>`);
    const rows=it.sources.map(s=>{const b=bossByName[s.boss];return `<div class="src-row"><span class="boss">${bossBtn(s.boss)}</span><span class="where">${esc(s.label)} · ${esc(b.tier)} · ${esc(b.loc)} · <b>${esc(b.req)}</b></span></div>`}).join("");
    body=`<div class="src">${rows}</div>`;
    if(it.shared)body+=`<p class="note">여러 소굴 우두머리의 공용 풀에서도 나옵니다${it.sources.length?" — 위 우두머리를 우선 파밍하세요":" — 필드 드랍과 호라드림의 함 제작을 병행하세요"}.</p>`;
    if(it.sources.length)body+=`<p class="note">벨리알 처치 후 ${it.sources.map(s=>esc(s.boss)).filter((v,i,a)=>a.indexOf(v)===i).join(" / ")} 전리품 풀을 선택해도 노릴 수 있습니다.</p>`;
  }
  return `<article class="item ${it.kind}"><h3>${hl(it.name,qq)}</h3><div class="tags">${tags.join("")}</div>${body}</article>`;
}

function search(raw){
  const qq=norm(raw);if(!qq)return[];
  const choMode=isChoOnly(qq);
  const scored=[];
  for(const it of ALL){
    if(!classOk(it))continue;
    let s=-1;
    if(choMode){const i=it.cho.indexOf(qq);if(i>=0)s=i===0?2:1}
    else{const i=it.key.indexOf(qq);if(i>=0)s=i===0?3:2;else{const ci=it.cho.indexOf(cho(qq));if(ci>=0&&/[ㄱ-ㅎ]/.test(raw))s=1}}
    if(s>=0)scored.push([s,it]);
  }
  return scored.sort((a,b)=>b[0]-a[0]||a[1].name.localeCompare(b[1].name,"ko")).map(x=>x[1]);
}

function renderHome(){
  const tiers=["소굴","상급 소굴","특수"];
  let h=`<p class="hint">아이템 이름 일부나 초성으로 찾을 수 있습니다. 직업을 고르면 그 직업이 쓰는 아이템만 보여요.</p>`;
  tiers.forEach(t=>{
    h+=`<h2 class="sec">${t==="특수"?"특수 우두머리":t+" 우두머리"}<small>${t==="소굴"?"소굴 열쇠":t==="상급 소굴"?"상급 소굴 열쇠":"별도 입장 재료"}</small></h2><div class="bosses">`;
    BOSSES.filter(b=>b.tier===t).forEach(b=>{h+=`<button class="bcard" data-boss="${esc(b.n)}"><span class="tier">${esc(b.req)}</span><b>${esc(b.n)}</b><span class="where">${esc(b.loc)}</span></button>`});
    if(t==="특수")h+=`<div class="bcard" style="cursor:default"><span class="tier">전리품 풀 선택</span><b>벨리알</b><span class="where">${esc(BELIAL.loc)} · 다른 우두머리의 드랍표를 골라 적용, 신화 확률 높음</span></div>`;
    h+=`</div>`;
  });
  h+=`<h2 class="sec">신화 고유<small>모든 우두머리 · 낮은 확률</small></h2><div class="tags">${MYTHIC.map(m=>`<span class="tag k-mythic">${esc(m[0])}</span>`).join("")}</div>`;
  h+=`<h2 class="sec">시즌15 신규 유산 고유<small>전담 우두머리 미확인</small></h2><div class="tags">${LEGACY.map(m=>`<span class="tag k-legacy">${esc(m[0])}</span>`).join("")}</div>`;
  out.innerHTML=h;
}

function renderBoss(n){
  const b=bossByName[n];if(!b)return;
  const rows=CLASSES.map((c,i)=>(cls==="전체"||cls===c)?`<tr><th>${c}</th><td>${b.d[i].split(",").map(x=>`<button data-item="${esc(x.trim())}">${esc(x.trim())}</button>`).join(", ")}</td></tr>`:"").join("");
  out.innerHTML=`<div class="bossview"><button class="back" data-home>← 전체 우두머리</button>
  <h2 class="sec" style="margin-top:4px">${esc(b.n)}<small>${esc(b.tier)} · ${esc(b.req)}</small></h2>
  <p class="where" style="margin:0 0 12px">${esc(b.loc)}</p>
  <div class="tbl"><table><tr><th>공용</th><td><button data-item="${esc(b.공용)}">${esc(b.공용)}</button></td></tr>${rows}</table></div>
  <p class="note" style="margin-top:12px">한 번 잡을 때 목록이 모두 나오거나 확정 드랍되는 것은 아닙니다. 신화 고유는 별도 확률로 함께 나옵니다.</p></div>`;
  window.scrollTo({top:0});
}

function render(){
  const raw=q.value;clearBtn.hidden=!raw;
  if(!norm(raw)){renderHome();return}
  const res=search(raw);
  out.innerHTML=`<p class="count">${res.length}개 아이템${cls!=="전체"?` · ${cls} 기준`:""}</p>`+
   (res.length?`<div class="results">${res.slice(0,60).map(it=>itemCard(it,raw)).join("")}</div>`:`<p class="empty">“${esc(raw)}”에 해당하는 아이템이 없습니다. 띄어쓰기 없이 일부만 입력하거나 초성으로 검색해 보세요${cls!=="전체"?", 또는 직업 필터를 ‘전체’로 바꿔 보세요":""}.</p>`);
}

q.addEventListener("input",render);
clearBtn.onclick=()=>{q.value="";render();q.focus()};
out.addEventListener("click",e=>{
  const bb=e.target.closest("[data-boss]");if(bb){renderBoss(bb.dataset.boss);return}
  const ib=e.target.closest("[data-item]");if(ib){q.value=ib.dataset.item;render();q.focus();return}
  if(e.target.closest("[data-home]")){q.value="";render()}
});
render();
</script>

</body></html>
