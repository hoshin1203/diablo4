:root{

/* ---------- 상태 ---------- */
const $=s=>document.querySelector(s);
const q=$("#q"),out=$("#out"),clearBtn=$("#clear");
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let cls="전체";{const v=store.get("d4cls");if(v&&(v==="전체"||CLASSES.includes(v)))cls=v}
let tab=location.hash==="#runewords"?"runewords":location.hash==="#drops"?"drops":(store.get("d4tab")==="runewords"?"runewords":"drops");
let picked=new Set();
const chipsEl=$("#classChips");
["전체",...CLASSES].forEach(c=>{const b=document.createElement("button");b.className="chip";b.textContent=c;b.setAttribute("aria-pressed",c===cls);
  b.onclick=()=>{cls=c;store.set("d4cls",c);chipsEl.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.textContent===c));render()};chipsEl.appendChild(b)});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setTab(t.dataset.tab));
function setTab(t){
  tab=t;store.set("d4tab",t);
  try{history.replaceState(null,"","#"+t)}catch(e){}
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===t));
  chipsEl.hidden=t!=="drops";
  render();
}

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(name,qq){
  if(!qq||isChoOnly(norm(qq)))return esc(name);
  const t=qq.trim(),i=name.indexOf(t);
  if(i<0)return esc(name);
  return esc(name.slice(0,i))+"<mark>"+esc(name.slice(i,i+t.length))+"</mark>"+esc(name.slice(i+t.length));
}
function classOk(it){
  if(cls==="전체")return true;
  if(it.kind==="unique")return it.classes.has(cls)||it.classes.has("공용");
  const c=it.cls;
  if(c==="모든 직업")return true;
  if(c.includes("제외"))return !c.includes(cls);
  return c.includes(cls);
}
function bossBtn(n){return `<button data-boss="${esc(n)}">${esc(n)}</button>`}

function itemCard(it,qq){
  const tags=[];let body="";
  if(it.kind==="mythic"){
    tags.push(`<span class="tag k-mythic">신화 고유</span>`,`<span class="tag">${esc(it.cls)}</span>`);
    body=`<p class="note">특정 우두머리 전담이 아니라 모든 소굴 우두머리 보상에서 직업·장비 제한에 맞게 낮은 확률로 나옵니다. <b>벨리알</b>이 신화 드랍 확률이 가장 높습니다 (${esc(BELIAL.loc)}). 룬워드 아이템을 큐브로 신화 업그레이드하는 방법도 있습니다.</p>`;
  }else if(it.kind==="legacy"){
    tags.push(`<span class="tag k-legacy">시즌15 신규 유산</span>`,`<span class="tag">${esc(it.slot)}</span>`,`<span class="tag">${esc(it.cls)}</span>`,`<span class="tag">고유 부적 ${it.amulet?"가능":"불가"}</span>`);
    body=`<p class="note">전담 우두머리가 확인되지 않았습니다. 일반 드랍, 시즌 콘텐츠, 보상 상자, 제작을 함께 활용하세요.</p>`;
  }else{
    const cl=[...it.classes].filter(c=>c!=="공용");
    tags.push(`<span class="tag">일반 고유</span>`);
    if(cl.length)tags.push(...cl.map(c=>`<span class="tag">${c}</span>`));
    if(it.shared)tags.push(`<span class="tag k-shared">공용 풀 · ${it.shared}</span>`);
    const rows=it.sources.map(s=>{const b=bossByName[s.boss];return `<div class="src-row"><span class="boss">${bossBtn(s.boss)}</span><span class="where">${esc(s.label)} · ${esc(b.tier)} · ${esc(b.loc)} · <b>${esc(b.req)}</b></span></div>`}).join("");
    body=`<div class="src">${rows}</div>`;
    if(it.shared)body+=`<p class="note">여러 소굴 우두머리의 공용 풀에서도 나옵니다${it.sources.length?" — 위 우두머리를 우선 파밍하세요":" — 필드 드랍과 호라드림의 함 제작을 병행하세요"}.</p>`;
    if(it.sources.length)body+=`<p class="note">벨리알 처치 후 ${it.sources.map(s=>esc(s.boss)).filter((v,i,a)=>a.indexOf(v)===i).join(" / ")} 전리품 풀을 선택해도 노릴 수 있습니다.</p>`;
  }
  return `<article class="item ${it.kind}"><h3>${hl(it.name,qq)}</h3><div class="tags">${tags.join("")}</div>${body}</article>`;
}

const fxHtml=s=>esc(s).replace(/\(\*([^)]+)\)/g,'<span class="ga">상급 $1</span>');
function runePill(code,pressed){return `<button class="rune" data-rune="${code}"${pressed!==undefined?` aria-pressed="${pressed}"`:""}>${RUNE_KO[code]}<small>${code}</small></button>`}
function rwCard(r,qq){
  const runes=r.runes.map(c=>runePill(c)).join("<i>+</i>");
  const li=[];
  if(r.base)li.push(`<li class="base">${fxHtml(r.base)}</li>`);
  r.fx.forEach(f=>li.push(`<li>${fxHtml(f)}</li>`));
  if(r.uniq)li.push(`<li class="uniq">고유 효과 · ${fxHtml(r.uniq)}</li>`);
  return `<article class="item rw"><div class="rw-head"><h3>${hl(r.name,qq)}</h3><span class="lvl">요구 레벨 ${r.lvl}</span></div>
  <div class="tags"><span class="tag">룬워드</span>${r.slots.split(",").map(s=>`<span class="tag">${esc(s.trim())}</span>`).join("")}</div>
  <div class="formula">${runes}</div><ul class="fx">${li.join("")}</ul></article>`;
}
function runeInfo(code){
  const i=RUNE_IDX[code],prev=RUNES[i-1],next=RUNES[i+1];
  const uses=RW.filter(r=>r.runes.includes(code));
  const chain=[prev&&`${prev[1]} → `,`<b>${RUNE_KO[code]}</b>`,next&&` → ${next[1]}`].filter(Boolean).join("");
  return `<article class="item rw"><div class="rw-head"><h3>룬: ${RUNE_KO[code]} (${code})</h3><span class="lvl">${i+1}단계 / 16</span></div>
  <p class="note">호라드릭 큐브 업그레이드: ${chain}${!prev?" (가장 낮은 룬)":""}${!next?" (가장 높은 룬)":""}</p>
  <p class="note">이 룬이 들어가는 룬워드 ${uses.length}개${uses.length?": "+uses.map(r=>esc(r.name)).join(", "):""}</p></article>`;
}

function searchItems(raw){
  const qq=norm(raw);if(!qq)return[];
  const choMode=isChoOnly(qq),scored=[];
  for(const it of ALL){
    if(!classOk(it))continue;
    let s=-1;
    if(choMode){const i=it.cho.indexOf(qq);if(i>=0)s=i===0?2:1}
    else{const i=it.key.indexOf(qq);if(i>=0)s=i===0?3:2;else{const ci=it.cho.indexOf(cho(qq));if(ci>=0&&/[ㄱ-ㅎ]/.test(raw))s=1}}
    if(s>=0)scored.push([s,it]);
  }
  return scored.sort((a,b)=>b[0]-a[0]||a[1].name.localeCompare(b[1].name,"ko")).map(x=>x[1]);
}
function matchRune(raw){
  const qq=norm(raw);if(!qq)return null;
  const r=RUNES.find(([en,ko])=>ko===qq||en.toLowerCase()===qq);
  return r?r[0]:null;
}
function searchRunewords(raw){
  const qq=norm(raw);if(!qq)return[];
  const choMode=isChoOnly(qq),rune=matchRune(raw),scored=[];
  for(const r of RW){
    let s=-1;
    if(choMode){if(r.cho.includes(qq))s=2}
    else{
      const i=r.key.indexOf(qq);
      if(i>=0)s=i===0?4:3;
      else if(rune&&r.runes.includes(rune))s=2;
      else if(qq.length>=2&&r.text.includes(qq))s=1;
    }
    if(s>=0)scored.push([s,r]);
  }
  return scored.sort((a,b)=>b[0]-a[0]||a[1].lvl-b[1].lvl).map(x=>x[1]);
}

function renderDropsHome(){
  const tiers=["소굴","상급 소굴","특수"];
  let h=`<p class="hint">아이템 이름 일부나 초성으로 찾을 수 있습니다. 직업을 고르면 그 직업이 쓰는 아이템만 보여요.</p>`;
  tiers.forEach(t=>{
    h+=`<h2 class="sec">${t==="특수"?"특수 우두머리":t+" 우두머리"}<small>${t==="소굴"?"소굴 열쇠":t==="상급 소굴"?"상급 소굴 열쇠":"별도 입장 재료"}</small></h2><div class="bosses">`;
    BOSSES.filter(b=>b.tier===t).forEach(b=>{h+=`<button class="bcard" data-boss="${esc(b.n)}"><span class="tier">${esc(b.req)}</span><b>${esc(b.n)}</b><span class="where">${esc(b.loc)}</span></button>`});
    if(t==="특수")h+=`<div class="bcard" style="cursor:default"><span class="tier">전리품 풀 선택</span><b>벨리알</b><span class="where">${esc(BELIAL.loc)} · 다른 우두머리의 드랍표를 골라 적용, 신화 확률 높음</span></div>`;
    h+=`</div>`;
  });
  h+=`<h2 class="sec">신화 고유<small>모든 우두머리 · 낮은 확률</small></h2><div class="tags">${MYTHIC.map(m=>`<span class="tag k-mythic">${esc(m[0])}</span>`).join("")}</div>`;
  h+=`<h2 class="sec">시즌15 신규 유산 고유<small>전담 우두머리 미확인</small></h2><div class="tags">${LEGACY.map(m=>`<span class="tag k-legacy">${esc(m[0])}</span>`).join("")}</div>`;
  out.innerHTML=h;
}

function renderRunewordsHome(){
  const bar=RUNES.map(([en],i)=>runePill(en,picked.has(en))+(i<RUNES.length-1?`<span class="arrow" aria-hidden="true">›</span>`:"")).join("");
  const list=RW.filter(r=>[...picked].every(p=>r.runes.includes(p)));
  let h=`<p class="hint">룬을 누르면 그 룬이 들어가는 룬워드만 보여요. 여러 개를 누르면 모두 들어가는 것만 남습니다. 룬은 왼쪽부터 낮은 단계이고, 호라드릭 큐브로 바로 다음 단계로 올릴 수 있어요.</p>
  <div class="runebar" style="margin-top:10px">${bar}</div>
  <p class="count" style="margin-top:14px">${list.length}개 룬워드${picked.size?` · ${[...picked].map(c=>RUNE_KO[c]).join(" + ")} 포함 <button class="linkbtn" data-clear-runes>선택 해제</button>`:""} · 괄호 안 ‘상급’은 상급 옵션이 붙었을 때 수치</p>
  <div class="results">${list.map(r=>rwCard(r,"")).join("")||`<p class="empty">선택한 룬이 모두 들어가는 룬워드가 없습니다.</p>`}</div>
  <h2 class="sec">룬워드·큐브 팁</h2>
  <div class="tips">
   <section><h3>룬워드로 만든 고유 아이템</h3><ul>
    <li>마법부여, 담금질, 명품화, 변성(선변성) 모두 가능합니다. 단, 변성한 뒤에는 신화 업그레이드를 할 수 없습니다.</li>
    <li>호라드릭 큐브로 신화 아이템으로 업그레이드할 수 있습니다(변성 전에만). 이렇게 만든 신화는 ‘제작 아이템’이 되어 중복 착용이 안 됩니다.</li>
    <li>룬워드 제작·융합 때 낮은 확률로 신화 룬워드 고유가 나옵니다.</li>
    <li>제작할 때 룬은 한꺼번에 넣어도 됩니다.</li>
    <li>시즌15 전용 아이템이며, 영구 콘텐츠로 남을지는 미정입니다.</li></ul></section>
   <section><h3>추천 업그레이드 순서</h3><ul>
    <li>룬워드 제작(소켓) → 담금질 → 명품화 → 신화 업그레이드(벼락불 5개) → 마법부여 → 마지막에 변성</li></ul></section>
   <section><h3>모든 부위 신화 착용하기</h3><ul>
    <li>제작 신화(신화 업그레이드한 룬워드)는 원래 1개만 착용할 수 있습니다.</li>
    <li>같은 제작 신화 3개를 큐브로 조합하면 제작 표시가 사라져 중복 착용이 가능해집니다.</li>
    <li>부위당 벼락불 15개면 담금질된 원하는 신화를 전 부위에 낄 수 있습니다.</li></ul></section>
   <section><h3>최대치 방어·보조 위상 얻기</h3><ul>
    <li>아무 선조 고유 목걸이를 신화로 업그레이드(벼락불 5개)하거나 일반 옵션 신화 목걸이를 준비합니다.</li>
    <li>쿨레 분광경으로 원하는 방어 또는 보조 위상을 바른 뒤 대장장이에서 분해하면 최대치 위상을 얻습니다.</li></ul></section>
  </div>`;
  out.innerHTML=h;
}

function renderBoss(n){
  const b=bossByName[n];if(!b)return;
  if(tab!=="drops"){tab="drops";setTabUI()}
  const rows=CLASSES.map((c,i)=>(cls==="전체"||cls===c)?`<tr><th>${c}</th><td>${b.d[i].split(",").map(x=>`<button data-item="${esc(x.trim())}">${esc(x.trim())}</button>`).join(", ")}</td></tr>`:"").join("");
  out.innerHTML=`<div class="bossview"><button class="back" data-home>← 전체 우두머리</button>
  <h2 class="sec" style="margin-top:4px">${esc(b.n)}<small>${esc(b.tier)} · ${esc(b.req)}</small></h2>
  <p class="where" style="margin:0 0 12px">${esc(b.loc)}</p>
  <div class="tbl"><table><tr><th>공용</th><td><button data-item="${esc(b.공용)}">${esc(b.공용)}</button></td></tr>${rows}</table></div>
  <p class="note" style="margin-top:12px">한 번 잡을 때 목록이 모두 나오거나 확정 드랍되는 것은 아닙니다. 신화 고유는 별도 확률로 함께 나옵니다.</p></div>`;
  window.scrollTo({top:0});
}
function setTabUI(){
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===tab));
  chipsEl.hidden=tab!=="drops";
}

function render(){
  const raw=q.value;clearBtn.hidden=!raw;
  if(!norm(raw)){tab==="drops"?renderDropsHome():renderRunewordsHome();return}
  const items=searchItems(raw),rws=searchRunewords(raw),rune=matchRune(raw);
  const itemBlock=items.length?`<div class="results">${items.slice(0,60).map(it=>itemCard(it,raw)).join("")}</div>`:"";
  const rwBlock=(rune?runeInfo(rune):"")+rws.map(r=>rwCard(r,raw)).join("");
  const blocks=[
    {key:"drops",n:items.length,title:`고유 아이템 ${items.length}개${cls!=="전체"?` · ${cls} 기준`:""}`,html:itemBlock},
    {key:"runewords",n:rws.length+(rune?1:0),title:`룬워드 ${rws.length}개`,html:rwBlock?`<div class="results">${rwBlock}</div>`:""}
  ];
  if(tab==="runewords")blocks.reverse();
  const shown=blocks.filter(b=>b.n);
  out.innerHTML=shown.length?shown.map((b,i)=>`<p class="count"${i?' style="margin-top:22px"':""}>${b.title}</p>${b.html}`).join(""):
   `<p class="empty">“${esc(raw)}”에 해당하는 아이템이나 룬워드가 없습니다. 띄어쓰기 없이 일부만 입력하거나 초성으로 검색해 보세요${cls!=="전체"?", 또는 직업 필터를 ‘전체’로 바꿔 보세요":""}.</p>`;
}

q.addEventListener("input",render);
clearBtn.onclick=()=>{q.value="";render();q.focus()};
out.addEventListener("click",e=>{
  const rb=e.target.closest("[data-rune]");
  if(rb){const c=rb.dataset.rune;
    if(tab==="runewords"&&!norm(q.value)){picked.has(c)?picked.delete(c):picked.add(c)}
    else{picked=new Set([c]);q.value="";setTab("runewords");window.scrollTo({top:0});return}
    render();return}
  if(e.target.closest("[data-clear-runes]")){picked.clear();render();return}
  const bb=e.target.closest("[data-boss]");if(bb){renderBoss(bb.dataset.boss);return}
  const ib=e.target.closest("[data-item]");if(ib){q.value=ib.dataset.item;render();q.focus();return}
  if(e.target.closest("[data-home]")){q.value="";render()}
});
setTab(tab);
</script>
